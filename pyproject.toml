[project]
name = "ballsdex-dragonwish"
version = "1.4.0"
description = "Dragon wishing for Ballsdex 3: gather dragon balls, summon a dragon, get rewards. Dragons, balls, emojis and relics are configured from the admin panel."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dragonwish"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ballsdex", "bd_models", "admin_panel", "settings", "dragonwish"]
split-on-trailing-comma = false
